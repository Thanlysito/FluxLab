{% extends "farm/base.html" %}{% load i18n %}
{% block title %}{% translate "Cambiar contraseña" %}{% endblock %}
{% block content %}
<div style="max-width:440px;margin-inline:auto">
  <h1>{% translate "Cambiar contraseña" %}</h1>
  <section class="card">
    <form class="form" method="post">{% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-block" type="submit">{% translate "Guardar" %}</button>
    </form>
  </section>
</div>
{% endblock %}
